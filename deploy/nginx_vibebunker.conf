# Phase 7.5a — nginx для ВайбБункера (vibebunker.ru)
#
# Установка:
#   sudo cp deploy/nginx_vibebunker.conf /etc/nginx/sites-available/vibebunker
#   sudo ln -sf /etc/nginx/sites-available/vibebunker /etc/nginx/sites-enabled/vibebunker
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo mkdir -p /var/www/certbot
#   sudo nginx -t && sudo systemctl reload nginx
#
# ВАЖНО про порядок: до выпуска сертификата рабочим остаётся ТОЛЬКО блок :80
# (в нём есть webroot-заглушка для ACME и временный proxy_pass, чтобы smoke-тест
# по http прошёл до certbot). Блок :443 закомментирован — с несуществующими
# путями к сертификатам nginx не стартует. После
#   sudo certbot --nginx -d vibebunker.ru -d www.vibebunker.ru
# certbot сам допишет 443-й сервер и редирект; если хочешь ручной вариант —
# раскомментируй нижний блок и убери временный proxy_pass из :80.

# WebSocket: Connection: upgrade только когда клиент реально апгрейдится
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream vibebunker_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

# ---------- HTTP :80 — ACME challenge + редирект на HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name vibebunker.ru www.vibebunker.ru;

    # Заглушка Let's Encrypt: этот путь НИКОГДА не редиректим
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Временный прокси до выпуска сертификата (шаг 9 smoke-теста по http).
    # После certbot строку можно заменить на: return 301 https://vibebunker.ru$request_uri;
    location / {
        proxy_pass         http://vibebunker_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
    }
}

